<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Matthew &amp; Jacqueline — Our Wedding</title>

    <!-- Load an elegant serif font for the headings (free, from Google Fonts) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&display=swap"
      rel="stylesheet"
    />

    <!-- Link our own stylesheet. The "?v=2" forces browsers to fetch a
         fresh copy after we make changes — bump the number when we edit CSS. -->
    <link rel="stylesheet" href="style.css?v=2" />
  </head>
  <body>
    <main class="hero">
      <h1>Matthew &amp; Jacqueline</h1>
      <p class="tagline">We're getting married</p>
      <hr class="divider" />
      <p class="details">
        <!-- Shown on larger screens (laptops/desktops) -->
        <span class="only-desktop">Wednesday, 19th May 2027 &middot; Hadsham Farm, Banbury</span>
        <!-- Shown on phones: two lines, dots instead of commas -->
        <span class="only-mobile">Wednesday &middot; 19th May 2027<br />Hadsham Farm &middot; Banbury</span>
      </p>

      <!-- Countdown timer — the numbers are filled in by script.js -->
      <div class="countdown" id="countdown">
        <div class="count-box">
          <span class="count-number" id="days">--</span>
          <span class="count-label">Days</span>
        </div>
        <div class="count-box">
          <span class="count-number" id="hours">--</span>
          <span class="count-label">Hours</span>
        </div>
        <div class="count-box">
          <span class="count-number" id="minutes">--</span>
          <span class="count-label">Minutes</span>
        </div>
        <div class="count-box">
          <span class="count-number" id="seconds">--</span>
          <span class="count-label">Seconds</span>
        </div>
      </div>
    </main>

    <!-- Load the countdown logic -->
    <script src="script.js"></script>
  </body>
</html>
